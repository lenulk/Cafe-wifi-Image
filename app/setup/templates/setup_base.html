<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ตั้งค่าเครื่อง{% endblock %} — Cafe-WiFi</title>
{% block head %}{% endblock %}
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#1a1d21;--muted:#666f7a;--line:#e2e6ea;--accent:#0b6b5e;
        --accent-ink:#fff;--err:#a01b1b;--err-bg:#fdeaea;--ok:#0d6b32;--ok-bg:#e8f6ec;--warn-bg:#fff6e0}
  @media (prefers-color-scheme: dark){:root{--bg:#14171a;--card:#1c2024;--ink:#e8eaed;--muted:#9aa4af;
        --line:#2c3238;--accent:#2aa08c;--accent-ink:#08130f;--err-bg:#3a1c1c;--ok-bg:#152e1e;--warn-bg:#3a2f10}}
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.6 system-ui,"Noto Sans Thai",-apple-system,sans-serif;background:var(--bg);color:var(--ink)}
  main{max-width:560px;margin:1rem auto;padding:0 1rem}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1.1rem 1.25rem;margin-bottom:1rem}
  h1{font-size:1.3rem;margin:.2rem 0 .8rem}
  .steps{display:flex;gap:.3rem;margin:.5rem 0 1rem;font-size:.8rem;color:var(--muted)}
  .steps span{flex:1;text-align:center;padding:.25rem 0;border-bottom:3px solid var(--line)}
  .steps span.on{color:var(--ink);font-weight:700;border-color:var(--accent)}
  label{display:block;font-weight:600;margin:.8rem 0 .25rem;font-size:.92rem}
  input{width:100%;padding:.6rem .7rem;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit}
  .code{font:1.4rem/1.2 ui-monospace,monospace;letter-spacing:.15em;text-transform:uppercase;text-align:center}
  .hint{color:var(--muted);font-size:.85rem;margin-top:.2rem}
  button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:7px;padding:.7rem 1.1rem;
         font:inherit;font-weight:600;cursor:pointer;width:100%;margin-top:1rem}
  button.secondary{background:transparent;color:var(--accent);border:1px solid var(--accent)}
  .err{background:var(--err-bg);color:var(--err);border-radius:7px;padding:.6rem .8rem;margin:.5rem 0}
  .ok{background:var(--ok-bg);color:var(--ok);border-radius:7px;padding:.6rem .8rem;margin:.5rem 0}
  .warn{background:var(--warn-bg);border-radius:7px;padding:.6rem .8rem;margin:.5rem 0}
  table{width:100%;border-collapse:collapse;font-size:.92rem}
  td{padding:.35rem 0;border-bottom:1px solid var(--line);vertical-align:top}
  td:first-child{color:var(--muted);width:45%}
  ol li{margin:.3rem 0}
  pre{white-space:pre-wrap;font-size:.75rem;background:var(--bg);padding:.5rem;border-radius:6px;max-height:16rem;overflow:auto}
</style>
</head>
<body>
<main>
  <div class="steps">
    {% for n, label in [(1,'รหัส'),(2,'แอดมิน'),(3,'เครือข่าย'),(4,'เราเตอร์'),(5,'บันทึก')] %}
      <span class="{{ 'on' if step == n else '' }}">{{ n }}. {{ label }}</span>
    {% endfor %}
  </div>
  {% for e in errors or [] %}<div class="err">{{ e }}</div>{% endfor %}
  {% block body %}{% endblock %}
</main>
</body>
</html>
